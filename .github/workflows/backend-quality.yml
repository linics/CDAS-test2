name: backend-quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend quality gate
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          CDAS_DATABASE_URL: sqlite:///./storage/cdas.db
          CDAS_DOCUMENTS_DIR: ./storage/documents
          CDAS_CHROMA_PERSIST_DIR: ./storage/chroma
          CDAS_AI_LOGS_DIR: ./storage
        run: python scripts/check_backend_quality.py
